<div class="pomodoro-container">
  <div class="container-header">
    <button
      type="button"
      class="settings-button"
      (click)="openSettingsModal()"
    >
      Configuracoes
    </button>
  </div>

  <app-session-selector
    [selectedSession]="pomodoroTimer.selectedSession"
    (sessionSelected)="onSessionSelected($event)"
  ></app-session-selector>
  <app-timer-display
    [formattedTime]="pomodoroTimer.formattedTime"
  ></app-timer-display>
  <app-timer-controls
    (startClicked)="pomodoroTimer.start()"
    (pauseClicked)="pomodoroTimer.pause()"
    (resetClicked)="pomodoroTimer.reset()"
  ></app-timer-controls>
</div>

<app-modal
  [isOpen]="isSettingsModalOpen"
  title="Configuracoes"
  (closed)="closeSettingsModal()"
>
  <div modalBody>
    <p class="modal-placeholder-text">
      A tela de configuracoes sera implementada neste modal reutilizavel.
    </p>
  </div>

  <div modalActions>
    <button
      type="button"
      class="modal-action-button"
      (click)="closeSettingsModal()"
    >
      Fechar
    </button>
  </div>
</app-modal>
