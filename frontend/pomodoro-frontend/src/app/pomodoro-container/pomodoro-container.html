<div class="pomodoro-layout">
  <div class="page-toolbar">
    <button
      type="button"
      class="settings-button"
      aria-label="Abrir configuracoes"
      (click)="openSettingsModal()"
    >
      ⚙
    </button>
  </div>

  <div class="pomodoro-container">
    <app-session-selector
      [selectedSession]="pomodoroTimer.selectedSession"
      (sessionSelected)="onSessionSelected($event)"
    ></app-session-selector>
    <app-timer-display
      [formattedTime]="pomodoroTimer.formattedTime"
    ></app-timer-display>
    <p class="daily-pomodoro-count" aria-live="polite">
      {{ dailyPomodoroProgressMessage }}
    </p>
    <app-timer-controls
      (startClicked)="onStartClicked()"
      (pauseClicked)="pomodoroTimer.pause()"
      (resetClicked)="pomodoroTimer.reset()"
    ></app-timer-controls>
  </div>
</div>

<app-modal
  [isOpen]="isSettingsModalOpen"
  title="Configuracoes"
  (closed)="closeSettingsModal()"
>
  <div modalBody>
    <app-settings-form
      [settings]="settingsForm"
      [browserNotificationPermissionStatus]="browserNotificationPermissionStatus"
      (settingsChange)="onSettingsFormChange($event)"
      (browserNotificationPermissionRequested)="requestBrowserNotificationPermission()"
    ></app-settings-form>
  </div>

  <div modalActions>
    <button
      type="button"
      class="modal-action-button secondary-action"
      (click)="restoreDefaultSettings()"
    >
      Restaurar padrao
    </button>

    <button
      type="button"
      class="modal-action-button ghost-action"
      (click)="closeSettingsModal()"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="modal-action-button"
      [disabled]="!canSaveSettings()"
      (click)="saveSettings()"
    >
      Salvar
    </button>
  </div>
</app-modal>
