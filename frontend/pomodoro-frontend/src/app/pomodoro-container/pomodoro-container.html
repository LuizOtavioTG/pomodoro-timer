<div class="pomodoro-container">
  <div class="container-header">
    <button
      type="button"
      class="settings-button"
      (click)="openSettingsModal()"
    >
      Configuracoes
    </button>
  </div>

  <app-session-selector
    [selectedSession]="pomodoroTimer.selectedSession"
    (sessionSelected)="onSessionSelected($event)"
  ></app-session-selector>
  <app-timer-display
    [formattedTime]="pomodoroTimer.formattedTime"
  ></app-timer-display>
  <app-timer-controls
    (startClicked)="pomodoroTimer.start()"
    (pauseClicked)="pomodoroTimer.pause()"
    (resetClicked)="pomodoroTimer.reset()"
  ></app-timer-controls>
</div>

<app-modal
  [isOpen]="isSettingsModalOpen"
  title="Configuracoes"
  (closed)="closeSettingsModal()"
>
  <div modalBody>
    <p class="settings-description">
      Defina a duracao de cada tipo de sessao em minutos.
    </p>

    <div class="settings-form">
      <label class="settings-field">
        <span class="settings-label">Pomodoro curto</span>
        <div class="settings-input-wrapper">
          <input
            type="number"
            min="1"
            max="120"
            step="1"
            class="settings-input"
            [(ngModel)]="settingsForm.shortMinutes"
          />
          <span class="settings-unit">min</span>
        </div>
      </label>

      <label class="settings-field">
        <span class="settings-label">Pomodoro longo</span>
        <div class="settings-input-wrapper">
          <input
            type="number"
            min="1"
            max="120"
            step="1"
            class="settings-input"
            [(ngModel)]="settingsForm.longMinutes"
          />
          <span class="settings-unit">min</span>
        </div>
      </label>

      <label class="settings-field">
        <span class="settings-label">Descanso</span>
        <div class="settings-input-wrapper">
          <input
            type="number"
            min="1"
            max="120"
            step="1"
            class="settings-input"
            [(ngModel)]="settingsForm.breakMinutes"
          />
          <span class="settings-unit">min</span>
        </div>
      </label>
    </div>

    @if (!isSettingsFormValid()) {
      <p class="settings-error">
        Use apenas numeros inteiros entre 1 e 120 minutos.
      </p>
    }
  </div>

  <div modalActions>
    <button
      type="button"
      class="modal-action-button secondary-action"
      (click)="restoreDefaultSettings()"
    >
      Restaurar padrao
    </button>

    <button
      type="button"
      class="modal-action-button ghost-action"
      (click)="closeSettingsModal()"
    >
      Cancelar
    </button>

    <button
      type="button"
      class="modal-action-button"
      [disabled]="!isSettingsFormValid()"
      (click)="saveSettings()"
    >
      Salvar
    </button>
  </div>
</app-modal>
