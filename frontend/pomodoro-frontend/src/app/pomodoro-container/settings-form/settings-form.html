<p class="settings-description">
  Defina a duração de cada tipo de sessão em minutos.
</p>

<div class="settings-form">
  <label class="settings-field">
    <span class="settings-label">Pomodoro curto</span>
    <div class="settings-input-wrapper">
      <input
        type="number"
        [min]="minMinutes"
        [max]="maxMinutes"
        step="1"
        class="settings-input"
        [ngModel]="settings.shortMinutes"
        (ngModelChange)="updateSetting('shortMinutes', $event)"
      />
      <span class="settings-unit">min</span>
    </div>
    @if (getShortError(); as shortError) {
      <p class="settings-error">{{ shortError }}</p>
    }
  </label>

  <label class="settings-field">
    <span class="settings-label">Pomodoro longo</span>
    <div class="settings-input-wrapper">
      <input
        type="number"
        [min]="minMinutes"
        [max]="maxMinutes"
        step="1"
        class="settings-input"
        [ngModel]="settings.longMinutes"
        (ngModelChange)="updateSetting('longMinutes', $event)"
      />
      <span class="settings-unit">min</span>
    </div>
    @if (getLongError(); as longError) {
      <p class="settings-error">{{ longError }}</p>
    }
  </label>

  <label class="settings-field">
    <span class="settings-label">Descanso</span>
    <div class="settings-input-wrapper">
      <input
        type="number"
        [min]="minMinutes"
        [max]="maxMinutes"
        step="1"
        class="settings-input"
        [ngModel]="settings.breakMinutes"
        (ngModelChange)="updateSetting('breakMinutes', $event)"
      />
      <span class="settings-unit">min</span>
    </div>
    @if (getBreakError(); as breakError) {
      <p class="settings-error">{{ breakError }}</p>
    }
  </label>

  <div class="settings-section">
    <p class="settings-section-title">Fluxo</p>

    <label class="settings-toggle">
      <span>
        <span class="settings-label">Iniciar próxima sessão automaticamente</span>
        <span class="settings-help">
          Alterna entre foco e descanso quando o timer terminar.
        </span>
      </span>
      <input
        type="checkbox"
        class="settings-checkbox"
        [ngModel]="settings.autoStartNextSession"
        (ngModelChange)="updateNotificationSetting('autoStartNextSession', $event)"
      />
    </label>
  </div>

  <div class="settings-section">
    <p class="settings-section-title">Alertas</p>

    <label class="settings-toggle">
      <span>
        <span class="settings-label">Som ao fim da sessão</span>
        <span class="settings-help">Toca um alerta quando o timer terminar.</span>
      </span>
      <input
        type="checkbox"
        class="settings-checkbox"
        [ngModel]="settings.soundNotificationsEnabled"
        (ngModelChange)="updateNotificationSetting('soundNotificationsEnabled', $event)"
      />
    </label>

    <label class="settings-toggle">
      <span>
        <span class="settings-label-row">
          <span class="settings-label">Notificação do navegador</span>
          <span
            class="settings-status"
            [ngClass]="getBrowserNotificationPermissionClass()"
          >
            {{ getBrowserNotificationPermissionLabel() }}
          </span>
        </span>
        <span class="settings-help">{{ getBrowserNotificationHelpText() }}</span>
      </span>
      <input
        type="checkbox"
        class="settings-checkbox"
        [ngModel]="settings.browserNotificationsEnabled"
        [disabled]="isBrowserNotificationToggleDisabled()"
        (ngModelChange)="updateNotificationSetting('browserNotificationsEnabled', $event)"
      />
    </label>
  </div>
</div>
